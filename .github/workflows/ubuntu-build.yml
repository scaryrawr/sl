name: Ubuntu Build SL

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ubuntu-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-deb
        run: cargo install cargo-deb
      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install Rust targets
        run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - name: Build Debug
        run: cargo build
      - name: Build Release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          COMPLETION_DIR="$(pwd)/completions" cargo build --release \
            --target=x86_64-unknown-linux-gnu --target=aarch64-unknown-linux-gnu
      - name: Test Native Binaries
        run: |
          ./target/debug/sl -h
          ./target/debug/sl -V
          ./target/x86_64-unknown-linux-gnu/release/sl -h
          ./target/x86_64-unknown-linux-gnu/release/sl -V
      - name: Build .deb Packages
        id: deb_build
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            cargo deb --manifest-path=apps/sl/Cargo.toml --target="$target" --no-build
            deb_file=$(ls target/"$target"/debian/sl_*.deb)
            arch=$(dpkg-deb --field "$deb_file" Architecture)
            echo "${arch}_file=$deb_file" >> "$GITHUB_OUTPUT"
            echo "${arch}_name=$(basename "$deb_file")" >> "$GITHUB_OUTPUT"
          done
      - name: Test .deb Packages
        run: |
          for deb_file in target/*/debian/sl_*.deb; do
            dpkg -I "$deb_file"
            dpkg -c "$deb_file"
          done
      - name: Upload amd64 .deb Package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.deb_build.outputs.amd64_name }}
          path: ${{ steps.deb_build.outputs.amd64_file }}
          if-no-files-found: error
      - name: Upload arm64 .deb Package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.deb_build.outputs.arm64_name }}
          path: ${{ steps.deb_build.outputs.arm64_file }}
          if-no-files-found: error
