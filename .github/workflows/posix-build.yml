name: Posix Build SL
on:
  workflow_call:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Build Debug
        run: cargo build
      - name: Build Release
        run: cargo build --release
      - name: Test
        run: |
          ./target/debug/sl -h
          ./target/debug/sl -V
          ./target/release/sl -h
          ./target/release/sl -V
