name: macOS Cross Build SL
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rust-cross/cargo-zigbuild:0.24.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache Cargo Registry
        uses: actions/cache@v6
        with:
          path: /usr/local/cargo/registry
          key: macos-cross-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Build Debug
        run: |
          cargo zigbuild --locked --package sl \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Build Release
        run: |
          cargo zigbuild --locked --package sl --release \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
